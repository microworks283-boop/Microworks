<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | MicroWorks</title><link rel="stylesheet" href="styles.css"><style>.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:28px;background:linear-gradient(135deg,#f5f3ff,#f8fafc)}.auth-card{width:min(100%,480px);background:#fff;border:1px solid #e7e5e4;border-radius:22px;padding:30px;box-shadow:0 18px 60px #312e8118}.auth-tabs{display:flex;gap:8px;margin:22px 0}.auth-tabs button{flex:1;padding:12px;border:1px solid #ddd6fe;border-radius:10px;background:#fff;cursor:pointer}.auth-tabs button.active{background:#6d4aff;color:#fff}.auth-card label{display:block;margin:14px 0;font-size:14px;font-weight:600}.auth-card input{display:block;width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border:1px solid #d6d3d1;border-radius:10px;font:inherit}.auth-card .primary{width:100%;margin-top:12px}.auth-msg{padding:12px;border-radius:10px;background:#f5f3ff;margin-top:14px;white-space:pre-wrap}.back{display:inline-block;margin-bottom:18px}.hidden{display:none!important}</style></head><body><main class="auth-wrap"><section class="auth-card"><a class="brand back" href="/"><span class="brandmark">M</span><span>Micro<span>Works</span></span></a><h1>Welcome to MicroWorks</h1><p>Sign up or log in securely with a one-time email code.</p><div class="auth-tabs"><button id="signupTab" class="active" type="button" onclick="setMode('signup')">Sign up</button><button id="loginTab" type="button" onclick="setMode('login')">Log in</button></div><form id="authForm" onsubmit="requestOtp(event)"><div id="nameGroup"><label>Full name<input id="fullName" autocomplete="name" maxlength="100" required></label><label>Email address<input id="email" type="email" autocomplete="email" maxlength="254" required></label></div><button id="sendBtn" class="primary" type="submit">Send OTP</button></form><form id="verifyForm" class="hidden" onsubmit="verifyOtp(event)"><label>6-digit OTP<input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required></label><button id="verifyBtn" class="primary" type="submit">Verify & continue</button><button class="primary" style="background:#fff;color:#5b3be5;border:1px solid #ddd6fe" type="button" onclick="backToPhone()">Change number</button></form><div id="message" class="auth-msg hidden" role="status"></div><p style="font-size:12px;color:#78716c;margin-top:20px">Never share your OTP with anyone. Email verification codes expire in 5 minutes. Never share your OTP with anyone.</p></section></main><script src="auth.js"></script></body></html>
